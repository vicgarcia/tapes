# MediaMTX test config, based on the production configuration.
logLevel: warn
logDestinations: [stdout]
authInternalUsers:
  - user: any
    pass:
    ips: []
    permissions:
      - action: read
      - action: publish
  - user: tapes
    pass: set-by-environment
    ips: []
    permissions:
      - action: playback
      - action: api
  - user: any
    pass:
    ips: ['127.0.0.1', '::1']
    permissions:
      - action: api
      - action: metrics
      - action: pprof
  - user: publisher
    pass:
    ips: ['127.0.0.1', '::1']
    permissions:
      - action: publish
api: yes
apiAddress: :9997
playback: yes
playbackAddress: :9996
readTimeout: 10s
writeTimeout: 10s
writeQueueSize: 2048
rtsp: yes
rtspAddress: :8554
rtspTransports: [tcp, udp]
rtspEncryption: "no"
rtspAuthMethods: [basic]
hls: yes
hlsAddress: :8888
hlsAlwaysRemux: yes
hlsVariant: lowLatency
hlsSegmentDuration: 1s
hlsPartDuration: 200ms
hlsSegmentCount: 7
rtmp: no
webrtc: no
srt: no
moq: no
pathDefaults:
  record: yes
  recordPath: /cameras/%path/%Y%m%d%H%M%S-%f%z
  recordFormat: fmp4
  recordPartDuration: 1s
  recordSegmentDuration: 10s
  recordDeleteAfter: 90d
  rtspTransport: tcp
paths:
  test:
    runOnInit: ffmpeg -re -f lavfi -i testsrc=size=640x360:rate=10 -c:v libx264 -preset ultrafast -tune zerolatency -g 24 -pix_fmt yuv420p -f rtsp rtsp://publisher@127.0.0.1:8554/test
    runOnInitRestart: yes
