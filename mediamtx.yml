# MediaMTX config

logLevel: warn
logDestinations: [stdout]
authInternalUsers:
  - user: any          # compose network and published rtsp: read only
    pass:
    ips: []
    permissions:
      - action: read
  - user: tapes        # the api; password comes from MEDIAMTX_PASS via compose
    pass: set-by-environment
    ips: []
    permissions:
      - action: playback
      - action: api
  - user: any          # debugging from inside the container
    pass:
    ips: ['127.0.0.1', '::1']
    permissions:
      - action: api
      - action: metrics
      - action: pprof
api: yes
apiAddress: :9997
playback: yes
playbackAddress: :9996
readTimeout: 10s
writeTimeout: 10s
writeQueueSize: 2048
rtsp: yes
rtspAddress: :8554
rtspTransports: [tcp, udp]
rtspEncryption: "no"
rtspAuthMethods: [basic]
hls: yes
hlsAddress: :8888
hlsAlwaysRemux: yes
hlsVariant: lowLatency
hlsSegmentDuration: 1s
hlsPartDuration: 200ms
hlsSegmentCount: 7       # lowLatency needs at least 7
rtmp: no
webrtc: no
srt: no
moq: no
pathDefaults:
  record: yes
  # %f is required by playback, %z keeps names unique when DST falls back
  recordPath: /cameras/%path/%Y%m%d%H%M%S-%f%z
  recordFormat: fmp4
  recordPartDuration: 1s
  recordSegmentDuration: 5m
  recordDeleteAfter: 90d
  rtspTransport: tcp
paths:
  # garage:
  #   source: rtsp://user:password@192.0.2.10:554/stream
