# Runs this repo's factory. Change tapes to this repo's name, so its containers and volumes are its own.
name: tapes-factory
services:
  factory:
    image: ghcr.io/vicgarcia/software-factory:latest
    # The one line a host changes to use another isolation option.
    privileged: true
    restart: unless-stopped
    stop_grace_period: 60s
    # Optional per-machine settings, git-ignored, from templates/.env. The repo's own settings go in config.yml.
    env_file:
      - path: .env
        required: false
    volumes:
      # This clone. Agents work in worktrees under .worktrees/.
      - ..:/workspace
      # The factory's databases and logs, git-ignored.
      - ./state:/state
      # The model login and the GitHub App's credentials, in a folder every repo's factory on this machine shares.
      - ${FACTORY_AUTH_DIR:-~/.factory}:/auth
      # A named volume, because a Windows bind can't back the overlay driver.
      - docker-data:/var/lib/docker
volumes:
  docker-data:
