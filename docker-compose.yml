services:

  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: mediamtx
    restart: unless-stopped
    environment:
      - TZ=${TZ:-UTC}
    ports:
      - "8554:8554"  # RTSP Local Proxy
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
      - ./data/cameras:/cameras

  tapes:
    image: ghcr.io/vicgarcia/tapes:latest
    build: .
    container_name: tapes
    restart: unless-stopped
    environment:
      - TZ=${TZ:-UTC}
    env_file:
      - .env
    ports:
      - "8671:8671"
    volumes:
      - ./data/cameras:/cameras
      - ./passwords:/opt/tapes/passwords:ro
    depends_on:
      - mediamtx

networks:

  default:
    name: tapes
    external: false
