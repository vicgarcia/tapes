services:

  mediamtx:
    image: bluenviron/mediamtx:1.21.2
    container_name: mediamtx
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "8554:8554"
    environment:
      - MTX_AUTHINTERNALUSERS_1_PASS=${MEDIAMTX_PASS:?set MEDIAMTX_PASS in .env}
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - ./mediamtx.yml:/mediamtx.yml:ro
      - ./data/cameras:/cameras

  tapes:
    image: ghcr.io/vicgarcia/tapes:latest
    container_name: tapes
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    environment:
      - TZ=${TZ:-UTC}
      - JWT_KEY=${JWT_KEY}
    env_file:
      - .env
    ports:
      - "8671:8671"
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - ./passwords:/opt/tapes/passwords:ro
      - ./data/cameras:/cameras
    depends_on:
      - mediamtx

networks:

  default:
    name: tapes
    external: false
