services:

  mediamtx:
    image: bluenviron/mediamtx:1.21.2
    container_name: mediamtx
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "8554:8554"
    environment:
      - MTX_AUTHINTERNALUSERS_1_PASS=${MEDIAMTX_PASS:?set MEDIAMTX_PASS in .env}
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - ./mediamtx.yml:/mediamtx.yml:ro
      # Recordings. Create the folder as the UID/GID above before starting, or Docker creates it owned by root.
      - ./data/cameras:/cameras

  tapes:
    image: ghcr.io/vicgarcia/tapes:latest
    container_name: tapes
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      - TZ=${TZ:-UTC}
      - JWT_KEY=${JWT_KEY}
      - MEDIAMTX_API_URL=${MEDIAMTX_API_URL:-http://mediamtx:9997}
      - MEDIAMTX_PLAYBACK_URL=${MEDIAMTX_PLAYBACK_URL:-http://mediamtx:9996}
      - MEDIAMTX_RTSP_URL=${MEDIAMTX_RTSP_URL:-rtsp://mediamtx:8554}
      - MEDIAMTX_HLS_URL=${MEDIAMTX_HLS_URL:-http://mediamtx:8888}
      - MEDIAMTX_USER=tapes
      - MEDIAMTX_PASS=${MEDIAMTX_PASS:?set MEDIAMTX_PASS in .env}
    env_file:
      - .env
    ports:
      - "8671:8671"
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - ./passwords:/opt/tapes/passwords:ro
    depends_on:
      - mediamtx

networks:

  default:
    name: tapes
    external: false
